[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zwt-finance-api"
version = "0.1.0"
description = "ZWT Finance modular API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pdfplumber>=0.11,<0.12",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1"
]


[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/templates/*.pdf", "assets/templates/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
